global:
  scrape_interval:     20s
  scrape_timeout:      15s

scrape_configs:
  - job_name: 'namenode'
    static_configs:
      - targets:
          - 'namenode:9404'

  - job_name: 'datanode'
    static_configs:
      - targets:
          - 'datanode1:9405'
          - 'datanode2:9406'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'
  
  - job_name: 'kudu'
    static_configs:
      - targets: 
          - 'kudu-exporter:9055'
        labels:
          cluster: 'kudu'