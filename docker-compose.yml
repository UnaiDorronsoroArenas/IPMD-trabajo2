
services:
  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_NAMENODE_OPTS=-javaagent:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar=9404:/opt/jmx/namenode.yaml
    volumes:
      - ./namenode:/opt/hadoop/data/nameNode
      - ./config:/opt/hadoop/etc/hadoop
      - ./parte_1/start-hdfs.sh:/start-hdfs.sh
      - ./config/log4j.properties:/opt/hadoop/etc/hadoop/log4j.properties
      - ./monitorizacion/jmx:/opt/jmx
    ports:
      - "9870:9870"
      - "9404:9404"
    command: [ "/bin/bash", "/start-hdfs.sh" ]
    restart: always
    networks:
      - practica2_network

  datanode1:
    image: apache/hadoop:3.4.1
    container_name: datanode1
    hostname: datanode1
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_DATANODE_OPTS=-javaagent:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar=9405:/opt/jmx/datanode.yaml
    volumes:
      - ./datanode1:/opt/hadoop/data/dataNode
      - ./config:/opt/hadoop/etc/hadoop
      - ./init-datanode.sh:/init-datanode.sh
      - ./config/log4j.properties:/opt/hadoop/etc/hadoop/log4j.properties
      - ./monitorizacion/jmx:/opt/jmx
    ports:
      - "9405:9405"
    depends_on:
      - namenode
    command: [ "/bin/bash", "/init-datanode.sh", "/mi_script.bash"]
    restart: always
    networks:
      - practica2_network

  datanode2:
    image: apache/hadoop:3.4.1
    container_name: datanode2
    hostname: datanode2
    user: root
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_DATANODE_OPTS=-javaagent:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar=9406:/opt/jmx/datanode.yaml
    volumes:
      - ./datanode2:/opt/hadoop/data/dataNode
      - ./config:/opt/hadoop/etc/hadoop
      - ./init-datanode.sh:/init-datanode.sh
      - ./config/log4j.properties:/opt/hadoop/etc/hadoop/log4j.properties
      - ./monitorizacion/jmx:/opt/jmx
    ports:
      - "9406:9406"
    depends_on:
      - namenode
    command: [ "/bin/bash", "/init-datanode.sh" ]
    restart: always
    networks:
      - practica2_network

  hive:
    image: apache/hive:4.2.0
    container_name: hive4
    hostname: hive4
    environment:
      - SERVICE_NAME=hiveserver2
    volumes:
      - ./Flights.parquet:/workspace/Flights.parquet
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - practica2_network


################
# KUDU cluster #
################
  kudu-master-1:
    image: apache/kudu:${KUDU_QUICKSTART_VERSION:-latest}
    container_name: kudu-master-1
    ports:
      - "7051:7051"
      - "8051:8051"
    command: ["master"]
    volumes:
      - kudu-master-1:/var/lib/kudu
    environment:
      - KUDU_MASTERS=kudu-master-1:7051,kudu-master-2:7151,kudu-master-3:7251
      # TODO: Use `host.docker.internal` instead of KUDU_QUICKSTART_IP when it
      # works on Linux (https://github.com/docker/for-linux/issues/264)
      - >
        MASTER_ARGS=--fs_wal_dir=/var/lib/kudu/master
        --rpc_bind_addresses=0.0.0.0:7051
        --rpc_advertised_addresses=${KUDU_QUICKSTART_IP:?Please set KUDU_QUICKSTART_IP environment variable}:7051
        --webserver_port=8051
        --webserver_advertised_addresses=${KUDU_QUICKSTART_IP}:8051
        --webserver_doc_root=/opt/kudu/www
        --stderrthreshold=0
        --use_hybrid_clock=false
        --unlock_unsafe_flags=true
    networks:
      - practica2_network

  kudu-master-2:
    image: apache/kudu:${KUDU_QUICKSTART_VERSION:-latest}
