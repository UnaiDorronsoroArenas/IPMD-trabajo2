##################
# Monitorización #
##################

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitorizacion/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro # compartimos fichero de configuración de prometheus
      - prometheus_data:/prometheus
    depends_on:
      - namenode
      - datanode1
      - datanode2
    networks:
      - practica2_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=1234
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitorizacion/grafana/provisioning:/etc/grafana/provisioning
      - ./monitorizacion/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - practica2_network

####################################################
# Monitorización de KUDU: kudu prometheus exporter #
####################################################
  kudu-exporter:
    image: eclipse-temurin:11-jre-alpine
    container_name: kudu-exporter
    hostname: kudu-exporter
    working_dir: /opt/kudu-exporter
    volumes:
      - ./monitorizacion/kudu-exporter:/opt/kudu-exporter
    ports:
      - "9055:9055"
    command: >
      java -jar ./prometheus-kudu-exporter-0.2.0.jar
           --config ./conf/kudu-exporter.yml
           --include ./conf/include-metrics
           --exclude ./conf/exclude-metrics
    depends_on:
      - kudu-master-1
      - kudu-master-2
      - kudu-master-3
      - kudu-tserver-1
      - kudu-tserver-2
      - kudu-tserver-3
      - kudu-tserver-4
      - kudu-tserver-5
    restart: unless-stopped
    networks:
      - practica2_network

volumes:
  kudu-master-1:
  kudu-master-2:
  kudu-master-3:
  kudu-tserver-1:
  kudu-tserver-2:
  kudu-tserver-3:
  kudu-tserver-4:
  kudu-tserver-5:
  prometheus_data:
  grafana_data:


networks:
  practica2_network:
    driver: bridge


 
